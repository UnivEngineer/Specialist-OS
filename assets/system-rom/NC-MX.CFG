# Colorful file types (last matching extension wins)
# FileColorSys  - color for files with FAT attributes S and H
# FileColorDef  - default color
# FileColorUser - file type override
FileColorUser  LightGreen    exe com rks mon fnt
FileColorUser  LightRed      bat cfg
FileColorUser  LightCyan     txt
FileColorUser  LightMagenta  zip arj rar lzh arc tar gz 7z
FileColorUser  LightGray     sys dll pf
FileColorSys   LightGray
FileColorDef   White

# Default panel sort mode (saved panel state takes precedence):
# 0 - unsorted; 1 - by name; 2 - by extension.
DefaultSortMode 2
StateFile A:\DOS\NC-STATE.CFG

# Initial panel drives (saved panel paths take precedence).
# Right panel falls back to B: when H: is unavailable.
DefaultLeftDrive A:
DefaultRightDrive H:
