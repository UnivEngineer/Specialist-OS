# Place the ROM and writable working diskette in specialist-mx/.
ifdef MX_RAMFOS
  @ROM = "specialist-mx/C-ROM-32k-MX-RAMFOS.bin"
  @ROM_BYTES = 0x8000
  @ROM_END = 0x7FFF
else
ifdef MX_ROM2
  @ROM = "specialist-mx/C-ROM-2k-MX-boot.bin"
  @ROM_BYTES = 0x800
  @ROM_END = 0x07FF
else
ifdef MX_ROM32
  @ROM = "specialist-mx/C-ROM-32k-MX-System.bin"
  @ROM_BYTES = 0x8000
  @ROM_END = 0x7FFF
else
  @ROM = "specialist-mx/C-ROM-48k-MX-System.bin"
  @ROM_BYTES = 0xC000
  @ROM_END = 0xBFFF
endif
endif
endif
ifndef MX_WORK_DISK
  @FLOPPY = "specialist-mx/A-Floppy-720k-MX-System.img"
endif
EmuWindow window
ifdef MX_RAMFOS
window.caption = "Specialist-MX / RAMFOS"
else
window.caption = "Specialist-MX / MXOS"
endif
window.windowStyle = autosize
window.frameScale = 2x
platform.codePage = koi8
Ram mainRam = 0x9000
SpecVideoRam videoRam = 0x3000
Ram upperRam = 0x3FC0
Ram bank0 = 0xFFC0
Ram shared = 0x20
Rom systemRom = @ROM, @ROM_BYTES
Ppi8255 ppi1
Ppi8255 ppi2
ifdef MX_EXTERNAL_FLASH
SpecialistFlashDisk flashDisk
flashDisk.image = "specialist-mx/A-Flash-1M-MX-System.bin"
flashDisk.chipCount = 2
flashDisk.readOnly = yes
ppi2.circuit = &flashDisk
endif
ifdef MX_EXTERNAL_ROM
RkRomDisk romDisk = "specialist-mx/H-ROM-64k-Games.bin"
ppi2.circuit = &romDisk
endif
Pit8253 pit
pit.frequency = 2000000
Fdc1793 fdc
FdImage diskA = 80, 2, 9, 512
ifndef MX_RAMFOS
diskA.fileName = @FLOPPY
endif
fdc.fdImage = 0, &diskA
SpecMxFddControlRegisters fddRegs
fddRegs.fdc = &fdc
Register colorReg
Register pageSelector
AddrSpace devices
devices.addrMask = 0x1F
devices.range = &ppi1, 0x00, 0x03
devices.range = &ppi2, 0x04, 0x07
devices.range = &fdc, 0x08, 0x0B
devices.range = &pit, 0x0C, 0x0F
devices.range = &fddRegs, 0x10, 0x13
devices.range = &colorReg, 0x18, 0x1B
devices.range = &pageSelector, 0x1C, 0x1F
AddrSpace mainPage
mainPage.range = &mainRam, 0x0000, 0x8FFF
mainPage.range = &videoRam, 0x9000, 0xBFFF
mainPage.range = &upperRam, 0xC000, 0xFFBF
mainPage.range = &shared, 0xFFC0, 0xFFDF
mainPage.range = &devices, 0xFFE0, 0xFFFF
AddrSpace romPage
romPage.range = &systemRom, 0x0000, @ROM_END
romPage.range = &upperRam, 0xC000, 0xFFBF
romPage.range = &shared, 0xFFC0, 0xFFDF
romPage.range = &devices, 0xFFE0, 0xFFFF
AddrSpace bankPage
bankPage.range = &bank0, 0x0000, 0xFFBF
bankPage.range = &shared, 0xFFC0, 0xFFDF
bankPage.range = &devices, 0xFFE0, 0xFFFF
AddrSpaceMapper addrSpace = 4
addrSpace.defaultPage = 2
addrSpace.page = 0, &mainPage
addrSpace.page = 1, &bankPage
addrSpace.page = 2, &romPage
addrSpace.page = 3, &romPage
pageSelector.defaultAddr = 2
connect pageSelector.addr[0-1] -> addrSpace.page
SpecRenderer crtRenderer
crtRenderer.screenMemory = &videoRam
crtRenderer.colorMode = mx
connect colorReg.output -> videoRam.curColorMx
SpecCore core
core.window = &window
core.crtRenderer = &crtRenderer
Cpu8080 cpu
cpu.frequency = 2000000
cpu.startAddr = 0
cpu.addrSpace = &addrSpace
cpu.core = &core
GeneralSoundSource tapeMonitor
SpecMxPit8253SoundSource pitSoundSource
pitSoundSource.pit = &pit
ifdef MX_MUTE
tapeMonitor.muted = yes
pitSoundSource.muted = yes
endif
SpecKbdLayout kbdLayout
kbdLayout.layout = smart
SpecKeyboard keyboard
keyboard.matrix = original
SpecPpi8255Circuit ppiCircuit
ppiCircuit.specKeyboard = &keyboard
# MX video attributes come from the color register. Port C scans the keyboard.
ppiCircuit.tapeSoundSource = &tapeMonitor
ppiCircuit.pitSoundSource = &pitSoundSource
ppi1.circuit = &ppiCircuit
