# Специалист-MX2 / MXOS. Профиль проекта для Emu80 4.0.571.
# H: ROM-диск либо четыре AT29C040A при определении FLASH_DISK.
EmuWindow window
window.caption = "Специалист-MX2 (MXOS / Emu80)"
window.windowStyle = autosize
window.frameScale = 2x
platform.codePage = koi8

Ram ram0 = 0x9000
ifdef MX2_MODELS
  SpecialistMx2VideoRam videoRam = 0x3000
else
  SpecVideoRam videoRam = 0x3000
endif
Ram upperRam = 0x3FC0
Ram sysRam = 0x20
ifdef SYSTEM_FLASH
  SpecialistSystemFlash systemFlash
  systemFlash.image = "specialist-os/system-flash.bin"
  ifdef SYSTEM_FLASH_LOCKED
    systemFlash.readOnly = yes
  endif
  AddrSpaceMapper systemFlashPages = 16
  systemFlashPages.page = 0, &systemFlash, 0x00000
  systemFlashPages.page = 1, &systemFlash, 0x08000
  systemFlashPages.page = 2, &systemFlash, 0x10000
  systemFlashPages.page = 3, &systemFlash, 0x18000
  systemFlashPages.page = 4, &systemFlash, 0x20000
  systemFlashPages.page = 5, &systemFlash, 0x28000
  systemFlashPages.page = 6, &systemFlash, 0x30000
  systemFlashPages.page = 7, &systemFlash, 0x38000
  systemFlashPages.page = 8, &systemFlash, 0x40000
  systemFlashPages.page = 9, &systemFlash, 0x48000
  systemFlashPages.page = 10, &systemFlash, 0x50000
  systemFlashPages.page = 11, &systemFlash, 0x58000
  systemFlashPages.page = 12, &systemFlash, 0x60000
  systemFlashPages.page = 13, &systemFlash, 0x68000
  systemFlashPages.page = 14, &systemFlash, 0x70000
  systemFlashPages.page = 15, &systemFlash, 0x78000
else
  Rom stdRom = "specialist-os/system.bin", 0x8000, 0
  Rom mxRom = "specialist-os/system.bin", 0x8000, 0x8000
endif

Ram ramDisk0 = 0xFFC0
Ram ramDisk1 = 0xFFC0
Ram ramDisk2 = 0xFFC0
Ram ramDisk3 = 0xFFC0
Ram ramDisk4 = 0xFFC0
Ram ramDisk5 = 0xFFC0
Ram ramDisk6 = 0xFFC0
Ram ramDisk7 = 0xFFC0
Ram ramDisk8 = 0xFFC0
Ram ramDisk9 = 0xFFC0
Ram ramDisk10 = 0xFFC0
Ram ramDisk11 = 0xFFC0
Ram ramDisk12 = 0xFFC0
Ram ramDisk13 = 0xFFC0
Ram ramDisk14 = 0xFFC0
Ram ramDisk15 = 0xFFC0

Ppi8255 ppi1
Ppi8255 ppi2
Pit8253 pit
pit.frequency = 2000000
Fdc1793 fdc
SpecMxFddControlRegisters fddRegs
fddRegs.fdc = &fdc
Register colorReg
Register pageSelector
AddrSpace dev
dev.addrMask = 0x1F
dev.range = &ppi1, 0x00, 0x03
dev.range = &ppi2, 0x04, 0x07
dev.range = &fdc, 0x08, 0x0B
dev.range = &pit, 0x0C, 0x0F
dev.range = &fddRegs, 0x10, 0x13
dev.range = &colorReg, 0x18, 0x1B
dev.range = &pageSelector, 0x1C, 0x1F

AddrSpace ramPage
ramPage.range = &ram0, 0x0000, 0x8FFF
ramPage.range = &videoRam, 0x9000, 0xBFFF
ramPage.range = &upperRam, 0xC000, 0xFFBF
ramPage.range = &sysRam, 0xFFC0, 0xFFDF
ramPage.range = &dev, 0xFFE0, 0xFFFF

AddrSpace romPage
ifdef SYSTEM_FLASH
  romPage.range = &systemFlashPages, 0x0000, 0x7FFF
else
  romPage.range = &mxRom, 0x0000, 0x7FFF
endif
romPage.range = &ram0, 0x8000, 0x8FFF, 0x8000
romPage.range = &videoRam, 0x9000, 0xBFFF
romPage.range = &upperRam, 0xC000, 0xFFBF
romPage.range = &sysRam, 0xFFC0, 0xFFDF
romPage.range = &dev, 0xFFE0, 0xFFFF

AddrSpaceMapper stdLower = 2
ifdef SYSTEM_FLASH
  stdLower.page = 0, &systemFlash
else
  stdLower.page = 0, &stdRom
endif
stdLower.page = 1, &ram0
connect colorReg.output[0] -> stdLower.page

AddrSpace stdPage
stdPage.range = &stdLower, 0x0000, 0x7FFF
stdPage.range = &ram0, 0x8000, 0x8FFF, 0x8000
stdPage.range = &videoRam, 0x9000, 0xBFFF
stdPage.range = &upperRam, 0xC000, 0xEFFF
stdPage.range = &dev, 0xF000, 0xF7FF
stdPage.range = &ppi1, 0xF800, 0xFFFF

AddrSpaceMapper ramDiskSpace = 16
ramDiskSpace.page = 0, &ramDisk0
ramDiskSpace.page = 1, &ramDisk1
ramDiskSpace.page = 2, &ramDisk2
ramDiskSpace.page = 3, &ramDisk3
ramDiskSpace.page = 4, &ramDisk4
ramDiskSpace.page = 5, &ramDisk5
ramDiskSpace.page = 6, &ramDisk6
ramDiskSpace.page = 7, &ramDisk7
ramDiskSpace.page = 8, &ramDisk8
ramDiskSpace.page = 9, &ramDisk9
ramDiskSpace.page = 10, &ramDisk10
ramDiskSpace.page = 11, &ramDisk11
ramDiskSpace.page = 12, &ramDisk12
ramDiskSpace.page = 13, &ramDisk13
ramDiskSpace.page = 14, &ramDisk14
ramDiskSpace.page = 15, &ramDisk15

AddrSpace ramDiskPage
ramDiskPage.range = &ramDiskSpace, 0x0000, 0xFFBF
ramDiskPage.range = &sysRam, 0xFFC0, 0xFFDF
ramDiskPage.range = &dev, 0xFFE0, 0xFFFF

AddrSpaceMapper addrSpace = 4
# Ядро Cpu8080 Emu80 пишет PUSH младшим байтом вперёд. Поэтому аппаратный
# вход через RST 0 в STD ROM здесь обходится: начинаем сразу с MX ROM.
# Его загрузчик не использует стек, а DOS сам устанавливает SP при входе.
addrSpace.defaultPage = 2
addrSpace.page = 0, &ramPage
addrSpace.page = 1, &ramDiskPage
addrSpace.page = 2, &romPage
addrSpace.page = 3, &stdPage
pageSelector.defaultAddr = 2
connect pageSelector.addr[0-1] -> addrSpace.page
connect pageSelector.output[0-3] -> ramDiskSpace.page
ifdef SYSTEM_FLASH
  connect pageSelector.output[0-3] -> systemFlashPages.page
endif

SpecRenderer crtRenderer
crtRenderer.screenMemory = &videoRam
crtRenderer.colorMode = mx2
ifdef MX2_MODELS
  connect colorReg.output -> videoRam.mx2ColorLatch
  connect pageSelector.addr[0-1] -> videoRam.mx2MemMode
else
  connect colorReg.output -> videoRam.curColorMx
endif
connect colorReg.output[1] -> crtRenderer.8color
connect pageSelector.addr[0-1] -> crtRenderer.mx2MemMode

SpecCore core
core.window = &window
core.crtRenderer = &crtRenderer
Cpu8080 cpu
cpu.frequency = 2000000
cpu.startAddr = 0
cpu.addrSpace = &addrSpace
cpu.core = &core

# Магнитофонный выход PC7 не подключён к динамику этой платы.
# Отдельное имя не позволяет старой настройке tapeSoundSource.muted=no
# из пользовательского ini включить мониторинг ленты снова.
GeneralSoundSource tapeMonitor
tapeMonitor.muted = yes
# Схема crossboard: GATE0/1/2=1, OUT1 -> CLK2.
# Два ЛЕ1 формируют звук: NOT PC5 AND (OUT0 OR OUT2).
SpecMxPit8253SoundSource pitSoundSource
pitSoundSource.pit = &pit
SpecKbdLayout kbdLayout
SpecKeyboard keyboard
keyboard.matrix = original
SpecPpi8255Circuit ppiCircuit
ppiCircuit.specKeyboard = &keyboard
ppiCircuit.videoRam = &videoRam
ppiCircuit.tapeSoundSource = &tapeMonitor
ppiCircuit.pitSoundSource = &pitSoundSource
ppi1.circuit = &ppiCircuit

ifdef FLASH_DISK
  SpecialistFlashDisk flashDisk
  flashDisk.image = "specialist-os/flash-disk.bin"
  flashDisk.chipCount = 4
  ppi2.circuit = &flashDisk
else
  RkRomDisk romDisk = "specialist-os/rom-disk.bin"
  ppi2.circuit = &romDisk
endif

RamDisk ramDisk = 16, 0x10000
ramDisk.filter = "RAM-диск (*.ramdisk)|*.ramdisk|Все файлы (*.*)|*"
ramDisk.page = 0, &ramDisk0
ramDisk.page = 1, &ramDisk1
ramDisk.page = 2, &ramDisk2
ramDisk.page = 3, &ramDisk3
ramDisk.page = 4, &ramDisk4
ramDisk.page = 5, &ramDisk5
ramDisk.page = 6, &ramDisk6
ramDisk.page = 7, &ramDisk7
ramDisk.page = 8, &ramDisk8
ramDisk.page = 9, &ramDisk9
ramDisk.page = 10, &ramDisk10
ramDisk.page = 11, &ramDisk11
ramDisk.page = 12, &ramDisk12
ramDisk.page = 13, &ramDisk13
ramDisk.page = 14, &ramDisk14
ramDisk.page = 15, &ramDisk15

